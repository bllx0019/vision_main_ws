#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""detection_node 的动态参数。

在 rqt_reconfigure（rosrun rqt_reconfigure rqt_reconfigure）里：
  * use_blue 这个复选框就是红/蓝切换开关
  * Red / Blue / Filter 三个分组分别调两套 HSV 和过滤阈值
改完即时生效，不用重启节点。
"""

PACKAGE = "detection_node"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

# ---- 红/蓝切换开关 ----
gen.add("use_blue", bool_t, 0, "颜色参数开关：false = 红(橙)  true = 蓝", False)

# ---- 红色（其实是偏橙的灯条） ----
red = gen.add_group("Red", "default", "红色(橙)目标的 HSV 范围")
red.add("red_h_min", int_t, 0, "H 下限", 5, 0, 180)
red.add("red_h_max", int_t, 0, "H 上限", 45, 0, 180)
red.add("red_s_min", int_t, 0, "S 下限", 75, 0, 255)
red.add("red_s_max", int_t, 0, "S 上限", 255, 0, 255)
red.add("red_v_min", int_t, 0, "V 下限", 75, 0, 255)
red.add("red_v_max", int_t, 0, "V 上限", 255, 0, 255)

# ---- 蓝色 ----
blue = gen.add_group("Blue", "default", "蓝色目标的 HSV 范围")
blue.add("blue_h_min", int_t, 0, "H 下限", 90, 0, 180)
blue.add("blue_h_max", int_t, 0, "H 上限", 111, 0, 180)
blue.add("blue_s_min", int_t, 0, "S 下限", 120, 0, 255)
blue.add("blue_s_max", int_t, 0, "S 上限", 255, 0, 255)
blue.add("blue_v_min", int_t, 0, "V 下限", 70, 0, 255)
blue.add("blue_v_max", int_t, 0, "V 上限", 255, 0, 255)

# ---- 过滤阈值 ----
filt = gen.add_group("Filter", "default", "几何过滤")
filt.add("min_cos_vert", double_t, 0, "长轴与竖直的 cos 下限（0.7071=45°，越大越严）",
         0.7071, 0.0, 1.0)
filt.add("min_area", double_t, 0, "轮廓面积下限（像素）", 50.0, 0.0, 100000.0)

# ---- 灯条两两配对（Pairing） ----
pairs = gen.add_group("Pairing", "default", "灯条两两配对")
pairs.add("pair_min_len_ratio", double_t, 0,
          "1 len", 0.8, 0.0, 1.0)
pairs.add("pair_max_angle_diff", double_t, 0,
          "2 ang", 10.0, 0.0, 45.0)
pairs.add("pair_same_tilt", bool_t, 0,
          "3 tilt", True)
pairs.add("pair_max_gap_ratio", double_t, 0,
          "4 gap", 5.0, 0.0, 20.0)
pairs.add("pair_min_long_angle", double_t, 0,
          "5 long", 80.0, 0.0, 90.0)
pairs.add("pair_max_edge_dy", double_t, 0,
          "6 edge", 8.0, 0.0, 100.0)
pairs.add("pair_max_use", int_t, 0,
          "每根灯条最多参与几次（1=只属于一块装甲；全局约束，不是判据）", 1, 1, 4)
pairs.add("pair_min_mid_angle", double_t, 0,
          "7 mid（两灯条中点连线与竖直的夹角下限；90=水平，越小越松）", 80.0, 0.0, 90.0)

# ---- 两条竖线两两匹配成“门”的条件 ----
match = gen.add_group("Match", "default", "竖直线段配对")
match.add("match_len_tol", double_t, 0, "长度相对误差上限 |ΔL| / 平均长度", 0.15, 0.0, 1.0)
match.add("match_angle_tol", double_t, 0, "倾角差上限（度）", 10.0, 0.0, 45.0)
match.add("match_max_gap", double_t, 0, "间距上限（× 平均长度）", 2.0, 0.0, 10.0)
match.add("gate_corner_tol", double_t, 0, "横线(1-4/2-3)与白色竖线的夹角偏离 90° 的上限（度）",
          10.0, 0.0, 45.0)
match.add("gate_horiz_tol", double_t, 0, "横线(1-4/2-3)相对图像水平线的最大倾角（地平线判断，度）",
          10.0, 0.0, 45.0)

exit(gen.generate(PACKAGE, "detection_node", "detection"))
